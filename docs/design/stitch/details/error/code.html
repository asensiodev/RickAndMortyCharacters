<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#121316;color:#e3e2e6;-webkit-tap-highlight-color:transparent;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"inverse-surface":"#e3e2e6","primary":"#a6caf0","surface-variant":"#343538","on-primary-fixed":"#001d33","on-secondary-fixed":"#0d1c2d","outline-variant":"#42474d","primary-fixed":"#cee5ff","surface-tint":"#a6caf0","tertiary-fixed":"#6dfe9c","on-secondary":"#233143","on-primary-container":"#083554","surface-container-lowest":"#0d0e11","surface-bright":"#38393c","tertiary-fixed-dim":"#4de082","surface-container-highest":"#343538","secondary":"#b9c8de","tertiary-container":"#00b25b","surface-container-low":"#1b1b1f","surface-container-high":"#292a2d","on-tertiary":"#003919","on-surface-variant":"#c2c7ce","on-secondary-container":"#a7b6cc","error":"#ffb4ab","tertiary":"#4de082","on-background":"#e3e2e6","on-error-container":"#ffdad6","error-container":"#93000a","on-surface":"#e3e2e6","inverse-on-surface":"#2f3034","background":"#121316","primary-container":"#7a9ec2","surface":"#121316","on-error":"#690005","inverse-primary":"#3d6183","on-tertiary-container":"#003b1a","secondary-fixed-dim":"#b9c8de","outline":"#8c9198","on-primary-fixed-variant":"#234a69","secondary-fixed":"#d4e4fa","on-secondary-fixed-variant":"#39485a","on-tertiary-fixed":"#00210c","surface-container":"#1f1f23","primary-fixed-dim":"#a6caf0","on-primary":"#043352","on-tertiary-fixed-variant":"#005227","surface-dim":"#121316","secondary-container":"#39485a"},borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"space-lg":"1.5rem","gutter":"1rem","margin":"1rem","space-xl":"2rem","space-xs":"0.25rem","space-sm":"0.5rem","space-md":"1rem"},fontFamily:{"title-md":["Roboto Flex"],"headline-sm":["Roboto Flex"],"headline-lg":["Roboto Flex"],"title-sm":["Roboto Flex"],"headline-md":["Roboto Flex"],"display-lg":["Roboto Flex"],"label-md":["Roboto Flex"],"label-sm":["Roboto Flex"],"title-lg":["Roboto Flex"],"body-lg":["Roboto Flex"],"body-sm":["Roboto Flex"],"body-md":["Roboto Flex"],"label-lg":["Roboto Flex"]},fontSize:{"title-md":["1rem",{"lineHeight":"1.5rem","letterSpacing":"0.01em","fontWeight":"500"}],"headline-sm":["1.5rem",{"lineHeight":"2rem","letterSpacing":"0em","fontWeight":"600"}],"headline-lg":["2rem",{"lineHeight":"2.5rem","letterSpacing":"0em","fontWeight":"600"}],"title-sm":["0.875rem",{"lineHeight":"1.25rem","letterSpacing":"0.01em","fontWeight":"500"}],"headline-md":["1.75rem",{"lineHeight":"2.25rem","letterSpacing":"0em","fontWeight":"600"}],"display-lg":["3.5rem",{"lineHeight":"4rem","letterSpacing":"-0.015em","fontWeight":"400"}],"label-md":["0.75rem",{"lineHeight":"1rem","letterSpacing":"0.03em","fontWeight":"500"}],"label-sm":["0.6875rem",{"lineHeight":"0.875rem","letterSpacing":"0.04em","fontWeight":"600"}],"title-lg":["1.375rem",{"lineHeight":"1.75rem","letterSpacing":"0em","fontWeight":"600"}],"body-lg":["1rem",{"lineHeight":"1.5rem","letterSpacing":"0.02em","fontWeight":"400"}],"body-sm":["0.75rem",{"lineHeight":"1rem","letterSpacing":"0.02em","fontWeight":"400"}],"body-md":["0.875rem",{"lineHeight":"1.25rem","letterSpacing":"0.015em","fontWeight":"400"}],"label-lg":["0.875rem",{"lineHeight":"1.25rem","letterSpacing":"0.01em","fontWeight":"500"}]}}}};</script></head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative min-h-[92vh] justify-between">
<!-- Top System Bar & Floating Back Control -->
<header class="w-full flex flex-col z-20">
<!-- Android Native Status Bar -->
<div class="w-full flex items-center justify-between px-6 pt-2 pb-1 text-on-surface select-none">
<span class="font-title-sm text-title-sm tracking-tight font-medium text-on-surface">9:30</span>
<div class="flex items-center gap-1.5 opacity-90">
<span class="material-symbols-outlined text-[17px]">network_cell</span>
<span class="material-symbols-outlined text-[17px]">wifi</span>
<span class="material-symbols-outlined text-[17px]">battery_full</span>
</div>
</div>
<!-- Floating Top Bar Actions: Back Button -->
<div class="w-full flex items-center justify-between px-4 pt-3">
<button aria-label="Navigate back" class="w-11 h-11 rounded-full bg-surface-container flex items-center justify-center text-on-surface shadow-md active:scale-90 transition-all duration-200 focus:outline-none" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-2xl text-on-surface">arrow_back</span>
</button>
<!-- Empty balance node to keep strict alignment -->
<div aria-hidden="true" class="w-11 h-11 pointer-events-none"></div>
</div>
</header>
<!-- Centered API Error Viewport matching SCREEN_8 failure style -->
<main class="flex-1 flex flex-col items-center justify-center px-6 -mt-8 text-center select-none">
<!-- Icon Container -->
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center mx-auto mb-6 shadow-sm">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'wght' 300;">error_outline</span>
</div>
<!-- Error Title & Subtext -->
<h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold text-center mb-2 tracking-tight">
      Couldn't load character
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[260px] mb-8 leading-relaxed">
      Something went wrong. Please try again.
    </p>
<!-- Prominent Native Retry Button -->
<button class="bg-primary-container text-on-primary-container font-label-lg text-label-lg font-semibold px-8 py-3 rounded-full flex items-center justify-center gap-2 shadow-sm mx-auto active:scale-95 transition-all duration-150 focus:outline-none" id="retry-btn" onclick="handleRetry()" type="button">
<span class="material-symbols-outlined text-xl transition-transform duration-500" id="retry-icon">refresh</span>
<span id="retry-label">Retry</span>
</button>
</main>
<!-- Bottom Android Gesture Bar Safe Area -->
<footer class="w-full flex flex-col items-center justify-end pb-3 select-none pointer-events-none">
<div class="w-36 h-1 bg-outline-variant/60 rounded-full"></div>
</footer>
</div>
<script>
  function handleRetry() {
    const icon = document.getElementById('retry-icon');
    const label = document.getElementById('retry-label');
    const btn = document.getElementById('retry-btn');
    
    if (icon && btn) {
      icon.classList.add('rotate-180');
      label.textContent = 'Retrying...';
      btn.classList.add('opacity-75');
      btn.disabled = true;

      setTimeout(() => {
        icon.classList.remove('rotate-180');
        label.textContent = 'Retry';
        btn.classList.remove('opacity-75');
        btn.disabled = false;
      }, 900);
    }
  }
</script></main></body></html>
