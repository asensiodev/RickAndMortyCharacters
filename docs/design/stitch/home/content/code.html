<script>
  (function () {
    const input = document.getElementById('character-search-input');
    const clearBtn = document.getElementById('search-clear-btn');
    const chips = document.querySelectorAll('.filter-chip');

    // Search clear micro-interaction
    if (input && clearBtn) {
      input.addEventListener('input', (e) => {
        if (e.target.value.length > 0) {
          clearBtn.classList.remove('opacity-0', 'pointer-events-none');
          clearBtn.classList.add('opacity-100', 'pointer-events-auto');
        } else {
          clearBtn.classList.remove('opacity-100', 'pointer-events-auto');
          clearBtn.classList.add('opacity-0', 'pointer-events-none');
        }
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        clearBtn.classList.remove('opacity-100', 'pointer-events-auto');
        clearBtn.classList.add('opacity-0', 'pointer-events-none');
        input.focus();
      });
    }

    // Filter chip toggle interactions
    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        chips.forEach((c) => {
          c.classList.remove('bg-secondary-container', 'text-primary-fixed', 'font-semibold', 'shadow-sm');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
          const icon = c.querySelector('.material-symbols-outlined');
          if (icon && icon.textContent === 'check') {
            icon.remove();
          }
        });

        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
        chip.classList.add('bg-secondary-container', 'text-primary-fixed', 'font-semibold', 'shadow-sm');

        // Prepend check icon if not present
        if (!chip.querySelector('.material-symbols-outlined')) {
          const checkIcon = document.createElement('span');
          checkIcon.className = 'material-symbols-outlined text-[16px] text-primary';
          checkIcon.style.fontVariationSettings = "'FILL' 1";
          checkIcon.textContent = 'check';
          chip.insertBefore(checkIcon, chip.firstChild);
        }
      });
    });
  })();
