<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface": "#121316", "on-secondary": "#233143", "tertiary": "#4de082", "surface-container": "#1f1f23", "on-secondary-fixed": "#0d1c2d", "on-primary-container": "#083554", "inverse-on-surface": "#2f3034", "on-tertiary-fixed": "#00210c", "on-surface-variant": "#c2c7ce", "secondary-fixed": "#d4e4fa", "surface-container-highest": "#343538", "background": "#121316", "primary": "#a6caf0", "tertiary-fixed": "#6dfe9c", "error": "#ffb4ab", "tertiary-fixed-dim": "#4de082", "on-secondary-fixed-variant": "#39485a", "surface-container-lowest": "#0d0e11", "tertiary-container": "#00b25b", "outline-variant": "#42474d", "surface-tint": "#a6caf0", "on-primary": "#043352", "primary-fixed": "#cee5ff", "primary-fixed-dim": "#a6caf0", "on-secondary-container": "#a7b6cc", "on-primary-fixed": "#001d33", "secondary-container": "#39485a", "on-tertiary-container": "#003b1a", "on-primary-fixed-variant": "#234a69", "inverse-surface": "#e3e2e6", "secondary-fixed-dim": "#b9c8de", "on-background": "#e3e2e6", "error-container": "#93000a", "surface-container-high": "#292a2d", "primary-container": "#7a9ec2", "inverse-primary": "#3d6183", "on-error-container": "#ffdad6", "secondary": "#b9c8de", "surface-bright": "#38393c", "surface-variant": "#343538", "on-tertiary": "#003919", "outline": "#8c9198", "on-tertiary-fixed-variant": "#005227", "on-error": "#690005", "surface-container-low": "#1b1b1f", "surface-dim": "#121316", "on-surface": "#e3e2e6" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-sm": "0.5rem", "space-md": "1rem", "gutter": "1rem", "space-xl": "2rem", "space-xs": "0.25rem", "space-lg": "1.5rem" }, fontFamily: { "label-lg": ["Roboto Flex"], "body-sm": ["Roboto Flex"], "headline-sm": ["Roboto Flex"], "title-sm": ["Roboto Flex"], "title-md": ["Roboto Flex"], "title-lg": ["Roboto Flex"], "body-lg": ["Roboto Flex"], "label-sm": ["Roboto Flex"], "body-md": ["Roboto Flex"], "label-md": ["Roboto Flex"], "display-lg": ["Roboto Flex"], "headline-md": ["Roboto Flex"], "headline-lg": ["Roboto Flex"] }, fontSize: { "label-lg": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "500" }], "body-sm": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.02em", "fontWeight": "400" }], "headline-sm": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "0em", "fontWeight": "600" }], "title-sm": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "500" }], "title-md": ["1rem", { "lineHeight": "1.5rem", "letterSpacing": "0.01em", "fontWeight": "500" }], "title-lg": ["1.375rem", { "lineHeight": "1.75rem", "letterSpacing": "0em", "fontWeight": "600" }], "body-lg": ["1rem", { "lineHeight": "1.5rem", "letterSpacing": "0.02em", "fontWeight": "400" }], "label-sm": ["0.6875rem", { "lineHeight": "0.875rem", "letterSpacing": "0.04em", "fontWeight": "600" }], "body-md": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.015em", "fontWeight": "400" }], "label-md": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.03em", "fontWeight": "500" }], "display-lg": ["3.5rem", { "lineHeight": "4rem", "letterSpacing": "-0.015em", "fontWeight": "400" }], "headline-md": ["1.75rem", { "lineHeight": "2.25rem", "letterSpacing": "0em", "fontWeight": "600" }], "headline-lg": ["2rem", { "lineHeight": "2.5rem", "letterSpacing": "0em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;background-color:#121316;color:#e3e2e6;font-family:'Roboto Flex',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface relative min-h-screen flex flex-col selection:bg-primary selection:text-on-primary"><div class="fixed top-0 inset-x-0 z-50 pointer-events-none pt-safe bg-surface/40 backdrop-blur-md"><div class="h-8 px-margin flex items-center justify-between text-on-surface/80"><span class="font-label-md text-label-md tracking-tight font-medium">9:30</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[17px]">wifi</span><span class="material-symbols-outlined text-[17px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[17px]">battery_full</span></div></div></div><main class="flex-1 flex flex-col w-full bg-surface pt-8 pb-24"><div class="flex flex-col w-full px-margin pb-6">
<!-- Search Field (M3 surface-container-highest, pill shape) -->
<div class="relative w-full mb-space-md">
<div class="w-full h-14 bg-surface-container-highest rounded-full flex items-center px-space-md gap-space-sm shadow-sm transition-all duration-200">
<span class="material-symbols-outlined text-outline select-none">search</span>
<input class="w-full bg-transparent border-none outline-none text-on-surface placeholder:text-outline font-body-md text-body-md" disabled="" placeholder="Search characters" type="text">
<button aria-label="Voice search or filter" class="flex items-center justify-center w-8 h-8 rounded-full text-outline hover:text-on-surface transition-colors active:bg-surface-container-high">

</button>
</div>
</div>
<!-- Single-choice Status Chips -->
<div class="flex items-center gap-space-sm overflow-x-auto no-scrollbar pb-space-sm mb-space-lg">
<!-- 'All' chip (Selected) -->
<button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-surface-container-high text-primary-fixed font-label-md text-label-md transition-colors shadow-sm whitespace-nowrap active:scale-95 duration-150">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="">All</span>
</button>
<!-- 'Alive' chip -->
<button class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg bg-surface-container text-on-surface-variant font-label-md text-label-md whitespace-nowrap hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="">Alive</span>
</button>
<!-- 'Dead' chip -->
<button class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg bg-surface-container text-on-surface-variant font-label-md text-label-md whitespace-nowrap hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="">Dead</span>
</button>
<!-- 'Unknown' chip -->
<button class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg bg-surface-container text-on-surface-variant font-label-md text-label-md whitespace-nowrap hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="w-2 h-2 rounded-full bg-outline"></span>
<span class="">Unknown</span>
</button>
</div>
<!-- Vertically Centered API Failure / Error & Retry State -->
<div class="flex flex-col items-center justify-center text-center px-space-md py-12">
<!-- Elevated Icon Container with subtle radial glow -->
<div class="relative flex items-center justify-center w-24 h-24 mb-6">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-xl"></div>
<div class="relative flex items-center justify-center w-20 h-20 rounded-full bg-surface-container-high shadow-md">
<span class="material-symbols-outlined text-[40px] text-primary select-none">error</span>
</div>
</div>
<!-- Error Title & Description -->
<h2 class="font-headline-sm text-headline-sm text-[#F0F2F5] tracking-tight mb-2">
      Couldn't load characters
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs leading-relaxed mb-8">
      Something went wrong. Please try again.
    </p>
<!-- Material 3 Retry Button -->
<button class="group relative inline-flex items-center justify-center gap-2 px-8 h-12 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg shadow-md hover:bg-primary-container/90 active:scale-95 transition-all duration-150 min-w-[140px]" id="retry-button">
<span class="material-symbols-outlined text-[20px] transition-transform duration-500" id="retry-icon">refresh</span>
<span id="retry-label" class="">Retry</span>
</button>
</div>
</div>
<script>
  // Micro-interaction for Retry action
  const retryBtn = document.getElementById('retry-button');
  const retryIcon = document.getElementById('retry-icon');
  const retryLabel = document.getElementById('retry-label');

  if (retryBtn) {
    retryBtn.addEventListener('click', () => {
      retryIcon.classList.add('animate-spin');
      retryLabel.textContent = 'Retrying...';
      retryBtn.disabled = true;
      retryBtn.classList.add('opacity-80', 'pointer-events-none');

      setTimeout(() => {
        retryIcon.classList.remove('animate-spin');
        retryLabel.textContent = 'Retry';
        retryBtn.disabled = false;
        retryBtn.classList.remove('opacity-80', 'pointer-events-none');
      }, 1800);
    });
  }

  // Ensure bottom counter pill from app shell is cleanly hidden in error state
  const observer = new MutationObserver(() => {
    const bottomPill = document.querySelector('.fixed.bottom-10');
    if (bottomPill) bottomPill.style.display = 'none';
  });
  observer.observe(document.body, { childList: true, subtree: true });
  const existingPill = document.querySelector('.fixed.bottom-10');
  if (existingPill) existingPill.style.display = 'none';
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe"><div class="h-8 flex items-center justify-center"><div class="w-28 h-1 rounded-full bg-on-surface/30"></div></div></div>


</body></html>
