<span class="material-symbols-outlined text-outline text-[22px] shrink-0 select-none">search</span>
<input class="w-full bg-transparent border-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-outline" id="character-search" placeholder="Search characters..." type="text" value="Zeep Xanflorp">
<button aria-label="Clear search query" class="w-8 h-8 rounded-full flex items-center justify-center bg-surface-variant hover:bg-surface-bright active:scale-95 transition-all text-on-surface-variant shrink-0" id="clear-btn" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 -mx-margin px-margin">

<span class="">All</span>
</button>
<button class="chip-filter px-3.5 py-1.5 rounded-lg bg-secondary-container text-on-secondary-fixed font-label-md text-label-md shrink-0 flex items-center gap-1.5 shadow-sm transition-colors active:scale-95" type="button">

</button>
<button class="chip-filter px-3.5 py-1.5 rounded-lg bg-surface-container text-on-surface-variant font-label-md text-label-md shrink-0 flex items-center gap-1.5 transition-colors active:scale-95" type="button">

<span class="">Dead</span>
</button>
<button class="chip-filter px-3.5 py-1.5 rounded-lg bg-surface-container text-on-surface-variant font-label-md text-label-md shrink-0 flex items-center gap-1.5 transition-colors active:scale-95" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-outline shrink-0"></span>

</div>
</div>
<div class="px-margin pt-20 pb-16 flex flex-col items-center justify-center text-center">
<div class="relative flex items-center justify-center mb-6">
<div class="absolute w-24 h-24 rounded-full bg-surface-container-high/60 blur-xl"></div>
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center relative shadow-sm">

</div>
</div>
<div class="flex flex-col items-center max-w-xs space-y-1.5">
<h2 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">

<p class="font-body-md text-body-md text-outline">

      </p>
</div>
<div class="mt-8 flex flex-wrap justify-center gap-2 max-w-xs opacity-75">
<button class="suggestion-tag px-3 py-1 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant font-label-sm text-label-sm transition-all" type="button">

<button class="suggestion-tag px-3 py-1 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant font-label-sm text-label-sm transition-all" type="button">

      </button>
<button class="suggestion-tag px-3 py-1 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant font-label-sm text-label-sm transition-all" type="button">
        "Beth"
      </button>
<button class="suggestion-tag px-3 py-1 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant font-label-sm text-label-sm transition-all" type="button">
        "Summer"
      </button>
</div>
</div>
</div>
<script>
  (function() {
    const searchInput = document.getElementById('character-search');
    const clearBtn = document.getElementById('clear-btn');
    const suggestionTags = document.querySelectorAll('.suggestion-tag');

    // Hide floating counter pill from app shell
    const floatingPills = document.querySelectorAll('.fixed.bottom-10');
    floatingPills.forEach(el => el.classList.add('hidden'));

    if (clearBtn && searchInput) {
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
      });
    }

    suggestionTags.forEach(tag => {
      tag.addEventListener('click', () => {
        const query = tag.textContent.replace(/"/g, '').trim();
        if (searchInput) {
          searchInput.value = query;
          searchInput.focus();
        }
      });
    });
  })();
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe"><div class="h-8 flex items-center justify-center"><div class="w-28 h-1 rounded-full bg-on-surface/30"></div></div></div>
