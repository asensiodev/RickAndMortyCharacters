schema: spec-driven

context: |
  Product: Rick And Morty Characters, a native Android app in Kotlin/Compose.
  Read README.md (Delivery scope section) for scope, README.md (Architecture section) for module contracts,
  openspec/specs/ for screen behavior and docs/DEVELOPMENT_PROCESS.md for the workflow.
  docs/BACKLOG.md indexes implemented changes and deferred work; prepare only a user-selected bounded change.

rules:
  tasks:
    - Keep implementation tasks small and independently verifiable.
    - Define observable test boundaries before behavior-focused TDD.
    - Record executed checks, results and limitations with the change.
    - Complete human review before advancing to the next change.
